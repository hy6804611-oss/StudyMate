<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>StudyMate CBT Result</title>

<link rel="stylesheet" href="cbtresult.css">

</head>

<body>

<div class="result-card">

<div class="trophy">
🏆
</div>

<h1>Excellent Work!</h1>

<p class="subtitle">
You have successfully completed your StudyMate CBT Exam.
</p>

<div class="score-circle">

<h2 id="percentage">
0%
</h2>

<p>Overall Score</p>

</div>

<div class="stats">

<div class="stat-box">
<h3>Score</h3>
<p id="score">0 / 0</p>
</div>

<div class="stat-box">
<h3>Grade</h3>
<p id="grade">A</p>
</div>

<div class="stat-box">
<h3>Correct</h3>
<p id="correct">0</p>
</div>

<div class="stat-box">
<h3>Wrong</h3>
<p id="wrong">0</p>
</div>

<div class="stat-box">
<h3>Time Used</h3>
<p id="timeUsed">00:00</p>
</div>

</div>

<button class="retryBtn">
🔄 Retake Exam
</button>

<button class="reviewBtn">
📖 Review Answers
</button>

<button class="dashboardBtn">
🏠 Back to Dashboard
</button>

</div>

<script src="cbtresult.js"></script>

<script src="navigation.js"></script>
</body>

</html>
