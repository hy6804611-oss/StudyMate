<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>StudyMate CBT Setup</title>

<link rel="stylesheet" href="cbtsetup.css">

</head>

<body>

<div class="container">

<h1>⏱ StudyMate CBT Setup</h1>

<p class="subtitle">

Choose your exam duration before starting.

</p>

<div class="time-options">

<button class="timeBtn" data-time="30">
30 Minutes
</button>

<button class="timeBtn" data-time="60">
1 Hour
</button>

<button class="timeBtn" data-time="120">
2 Hours
</button>

<button class="timeBtn" data-time="custom">
Custom Time
</button>

</div>

<button id="continueBtn" disabled>

🚀 Continue to CBT

</button>

</div>

<script src="cbtsetup.js"></script>

</body>

</html>
