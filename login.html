<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>StudyMate Login</title>

<link rel="stylesheet" href="style.css">

</head>

<body class="login-page">

<div class="login-container">

<div class="login-logo">
📚
</div>

<h1 class="login-title">📚 StudyMate</h1>

<h2 class="login-heading">Welcome Back</h2>

<p class="login-text">Sign in to continue your learning journey.</p>

<input
type="email"
id="email"
placeholder="Email Address">

<input
type="password"
id="password"
placeholder="Password">

<button id="loginBtn" class="login-btn">
🔐 Login
</button>

<a href="forgotpassword.html" class="login-link">
Forgot Password?
</a>

<button
class="signup-btn"
onclick="location.href='signup.html'">
📝 Create Account
</button>

<button
class="home-btn"
onclick="location.href='index.html'">
🏠 Back to Home
</button>

</div>

<script type="module" src="auth.js"></script>

</body>
</html>
