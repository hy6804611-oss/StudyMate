<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>StudyMate Notifications</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body class="notification-page">


<div class="notification-container">


    <!-- HEADER -->

    <div class="notification-header">

        <div class="notification-icon">
            🔔
        </div>

        <div>

            <h1>
                Notifications
            </h1>

            <p>
                Stay updated with your StudyMate learning journey.
            </p>

        </div>

    </div>



    <!-- NOTIFICATION LIST -->

    <div
        class="notification-list"
        id="notificationList"
    >

        <div class="notification-empty">

            <div class="notification-empty-icon">
                🔔
            </div>

            <h2>
                No notifications yet
            </h2>

            <p>
                Your StudyMate reminders and updates
                will appear here.
            </p>

        </div>

    </div>



    <!-- BACK BUTTON -->

    <button
        type="button"
        class="back-btn"
        onclick="location.href='dashboard.html'"
    >
        ← Back to Dashboard
    </button>


</div>


<script src="notification.js"></script>


</body>

</html>
